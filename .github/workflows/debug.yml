name: Build Kivy Android APK in Debug Mode

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Layout Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip aidl python3-pip python3-venv autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev libncurses5 cmake

    - name: Install Buildozer Core
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.33 kivy flask

    - name: Accept Android SDK Licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/analytics.settings
        echo "count=0" > $HOME/.android/analytics.settings
        yes | sdkmanager --licenses || true

    - name: Execute Buildozer Engine
      run: |
        buildozer -v android debug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
