name: Build Kivy Android APK in Debug Mode

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip aidl python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev curl

    - name: Install Buildozer and tools
      run: |
        python3 -m pip install --upgrade pip setuptools wheel
        pip install buildozer cython==0.29.33 kivy flask

    - name: Auto-accept Android SDK Licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/analytics.settings
        echo "count=0" > $HOME/.android/analytics.settings
        yes | sdkmanager --licenses || true

    - name: Build APK with Buildozer
      run: 
      |
      buildozer -v android debug
      env:
        ACCEPT_SDK_LICENSE: "y"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk

