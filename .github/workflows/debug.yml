name: Build Kivy Android APK in Debug Mode

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Layout Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip aidl python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev

    - name: Build APK with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        workdir: .
        buildozer_version: stable

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
